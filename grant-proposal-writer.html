                const processed = [];

                    if (file.size > 5 * 1024 * 1024) continue;

                        const content = await new Promise((res, rej) => {
                            const r = new FileReader();
                            r.onload = e => res(e.target.result);
                            r.onerror = rej;
                            r.readAsText(file);
                        });
                        const isBinary = content.includes('%PDF') || content.includes('PK') || /[\x00-\x08]/.test(content.slice(0,500));
                        processed.push({
                            name: file.name,
                            content: isBinary ? `[${file.name}: Binary file - please copy/paste text]` : content,
                            warning: isBinary

                const orgContext = [

                                            <input type="text" value={orgDetails.name} onChange={e => setOrgDetails({...orgDetails, name: e.target.value})}
                                                placeholder="Legal registered name" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Registration Number</label>
                                            <input type="text" value={orgDetails.registration} onChange={e => setOrgDetails({...orgDetails, registration: e.target.value})}
                                                placeholder="e.g., 501(c)(3) #" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Country</label>
                                            <input type="text" value={orgDetails.country} onChange={e => setOrgDetails({...orgDetails, country: e.target.value})}
                                                placeholder="e.g., Kenya" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Project Location/Region</label>
                                            <input type="text" value={orgDetails.location} onChange={e => setOrgDetails({...orgDetails, location: e.target.value})}
                                                placeholder="e.g., Nairobi County" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Founded Year</label>
                                            <input type="text" value={orgDetails.foundingYear} onChange={e => setOrgDetails({...orgDetails, foundingYear: e.target.value})}
                                                placeholder="e.g., 2010" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Staff Size</label>
                                            <input type="text" value={orgDetails.staffSize} onChange={e => setOrgDetails({...orgDetails, staffSize: e.target.value})}
                                                placeholder="e.g., 25 full-time" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Annual Budget</label>
                                            <input type="text" value={orgDetails.annualBudget} onChange={e => setOrgDetails({...orgDetails, annualBudget: e.target.value})}
                                                placeholder="e.g., 500,000" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Currency</label>
                                            <select value={orgDetails.currency} onChange={e => setOrgDetails({...orgDetails, currency: e.target.value})}
                                                className="w-full p-2 border border-slate-300 rounded-lg text-sm">
                                                <option>USD</option><option>EUR</option><option>GBP</option><option>CHF</option><option>Other</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Budget Request *</label>
                                            <input type="text" value={orgDetails.budgetRequest} onChange={e => setOrgDetails({...orgDetails, budgetRequest: e.target.value})}
                                                placeholder="e.g., 150,000" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Project Duration</label>
                                            <input type="text" value={orgDetails.projectDuration} onChange={e => setOrgDetails({...orgDetails, projectDuration: e.target.value})}
                                                placeholder="e.g., 24 months" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                        <div className="sm:col-span-2">
                                            <label className="block text-xs font-medium text-slate-600 mb-1">Target Beneficiaries *</label>
                                            <input type="text" value={orgDetails.beneficiaries} onChange={e => setOrgDetails({...orgDetails, beneficiaries: e.target.value})}
                                                placeholder="e.g., 5,000 smallholder farmers (60% women) in 3 districts" className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                        </div>
                                    </div>

                                    <div className="mb-3">
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Mission & Background</label>
                                        <textarea value={orgDetails.mission} onChange={e => setOrgDetails({...orgDetails, mission: e.target.value})}
                                            placeholder="Organization mission, history, key achievements..." className="w-full h-20 p-2 border border-slate-300 rounded-lg text-sm resize-y" />
                                    </div>
                                    <div className="mb-3">
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Relevant Experience</label>
                                        <textarea value={orgDetails.experience} onChange={e => setOrgDetails({...orgDetails, experience: e.target.value})}
                                            placeholder="Similar projects, grants managed, success metrics..." className="w-full h-20 p-2 border border-slate-300 rounded-lg text-sm resize-y" />
                                    </div>
                                    <div className="mb-4">
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Website</label>
                                        <input type="text" value={orgDetails.website} onChange={e => setOrgDetails({...orgDetails, website: e.target.value})}
                                            placeholder="https://..." className="w-full p-2 border border-slate-300 rounded-lg text-sm" />
                                    </div>

                                    <div className="flex gap-2">
                                        <button onClick={() => setActiveTab('documents')} className="py-3 px-6 bg-slate-100 rounded-xl">← Back</button>
                                        <button onClick={() => setActiveTab('team')} className="flex-1 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700">Continue →</button>
                                    </div>
                                </div>
                            )}

                            {/* Tab 3: Team & Partners */}
                            {activeTab === 'team' && (
                                <div>
                                    <h2 className="text-lg font-bold text-slate-800 mb-4">Key Personnel & Partners</h2>

                                    {/* Team Members */}
                                    <div className="mb-6">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-sm font-semibold text-slate-700">Key Personnel</label>
                                            <button onClick={addTeamMember} className="text-xs text-indigo-600 hover:text-indigo-800">+ Add Person</button>
                                        </div>
                                        {teamMembers.map((member, i) => (
                                            <div key={i} className="bg-slate-50 p-3 rounded-lg mb-2">
                                                <div className="grid sm:grid-cols-4 gap-2">
                                                    <input type="text" value={member.name} onChange={e => updateTeamMember(i, 'name', e.target.value)}
                                                        placeholder="Name" className="p-2 border border-slate-300 rounded text-sm" />
                                                    <input type="text" value={member.role} onChange={e => updateTeamMember(i, 'role', e.target.value)}
                                                        placeholder="Role (e.g., Project Manager)" className="p-2 border border-slate-300 rounded text-sm" />
                                                    <input type="text" value={member.qualifications} onChange={e => updateTeamMember(i, 'qualifications', e.target.value)}
                                                        placeholder="Qualifications" className="p-2 border border-slate-300 rounded text-sm" />
                                                    <div className="flex gap-2">
                                                        <input type="text" value={member.timeCommitment} onChange={e => updateTeamMember(i, 'timeCommitment', e.target.value)}
                                                            placeholder="% Time" className="flex-1 p-2 border border-slate-300 rounded text-sm" />
                                                        {teamMembers.length > 1 && (
                                                            <button onClick={() => removeTeamMember(i)} className="text-red-500 text-sm px-2">×</button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Partners */}
                                    <div className="mb-6">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-sm font-semibold text-slate-700">Partner Organizations</label>
                                            <button onClick={addPartner} className="text-xs text-indigo-600 hover:text-indigo-800">+ Add Partner</button>
                                        </div>
                                        {partners.map((partner, i) => (
                                            <div key={i} className="bg-slate-50 p-3 rounded-lg mb-2">
                                                <div className="grid sm:grid-cols-4 gap-2">
                                                    <input type="text" value={partner.name} onChange={e => updatePartner(i, 'name', e.target.value)}
                                                        placeholder="Organization Name" className="p-2 border border-slate-300 rounded text-sm" />
                                                    <select value={partner.type} onChange={e => updatePartner(i, 'type', e.target.value)}
                                                        className="p-2 border border-slate-300 rounded text-sm">
                                                        <option value="">Type...</option>
                                                        <option>NGO</option><option>Government</option><option>Private Sector</option>
                                                        <option>Academic</option><option>CBO</option><option>UN Agency</option>
                                                    </select>
                                                    <input type="text" value={partner.role} onChange={e => updatePartner(i, 'role', e.target.value)}
                                                        placeholder="Role in Project" className="p-2 border border-slate-300 rounded text-sm" />
                                                    <div className="flex gap-2">
                                                        <input type="text" value={partner.contribution} onChange={e => updatePartner(i, 'contribution', e.target.value)}
                                                            placeholder="Contribution" className="flex-1 p-2 border border-slate-300 rounded text-sm" />
                                                        {partners.length > 1 && (
                                                            <button onClick={() => removePartner(i)} className="text-red-500 text-sm px-2">×</button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="flex gap-2">
                                        <button onClick={() => setActiveTab('organization')} className="py-3 px-6 bg-slate-100 rounded-xl">← Back</button>
                                        <button onClick={() => setActiveTab('budget')} className="flex-1 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700">Continue →</button>
                                    </div>
                                </div>
                            )}

                            {/* Tab 4: Budget */}
                            {activeTab === 'budget' && (
                                <div>
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="text-lg font-bold text-slate-800">Budget Framework</h2>
                                        <button onClick={() => setShowBudgetHelper(true)} className="text-xs text-indigo-600 hover:text-indigo-800">📊 Category Guide</button>
                                    </div>

                                    <div className="bg-indigo-50 p-3 rounded-lg mb-4 flex justify-between items-center">
                                        <span className="text-sm text-indigo-800">Preliminary Total:</span>
                                        <span className="font-bold text-indigo-700">{orgDetails.currency} {getTotalBudget().toLocaleString()}</span>
                                    </div>

                                    <div className="mb-4">
                                        <div className="flex justify-between items-center mb-2">
                                            <label className="text-sm font-semibold text-slate-700">Budget Line Items</label>
                                            <button onClick={addBudgetItem} className="text-xs text-indigo-600 hover:text-indigo-800">+ Add Item</button>
                                        </div>
                                        {budgetItems.map((item, i) => (
                                            <div key={i} className="bg-slate-50 p-3 rounded-lg mb-2">
                                                <div className="grid sm:grid-cols-4 gap-2">
                                                    <select value={item.category} onChange={e => updateBudgetItem(i, 'category', e.target.value)}
                                                        className="p-2 border border-slate-300 rounded text-sm">
                                                        <option value="">Category...</option>
                                                        {BUDGET_CATEGORIES.map(c => <option key={c.name}>{c.name}</option>)}
                                                    </select>
                                                    <input type="text" value={item.item} onChange={e => updateBudgetItem(i, 'item', e.target.value)}
                                                        placeholder="Line Item" className="p-2 border border-slate-300 rounded text-sm" />
                                                    <input type="number" value={item.amount} onChange={e => updateBudgetItem(i, 'amount', e.target.value)}
                                                        placeholder="Amount" className="p-2 border border-slate-300 rounded text-sm" />
                                                    <div className="flex gap-2">
                                                        <input type="text" value={item.justification} onChange={e => updateBudgetItem(i, 'justification', e.target.value)}
                                                            placeholder="Justification" className="flex-1 p-2 border border-slate-300 rounded text-sm" />
                                                        {budgetItems.length > 1 && (
                                                            <button onClick={() => removeBudgetItem(i)} className="text-red-500 text-sm px-2">×</button>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="mb-4">
                                        <label className="block text-xs font-medium text-slate-600 mb-1">Additional Context</label>
                                        <textarea value={additionalContext} onChange={e => setAdditionalContext(e.target.value)}
                                            placeholder="Any additional information: co-funding sources, special requirements, innovation aspects, specific outcomes..."
                                            className="w-full h-20 p-2 border border-slate-300 rounded-lg text-sm resize-y" />
                                    </div>

                                    <div className="flex gap-2">
                                        <button onClick={() => setActiveTab('team')} className="py-3 px-6 bg-slate-100 rounded-xl">← Back</button>
                                        <button onClick={generatePrompt} disabled={getCharCount() < 50}
                                            className="flex-1 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-xl hover:from-indigo-700 hover:to-purple-700 disabled:opacity-50 shadow-lg">
                                            ✨ Generate Proposal Prompt
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Tab 5: Output */}
                            {activeTab === 'output' && (
                                <div>
                                    {generatedPrompt ? (
                                        <>
                                            {copySuccess && (
                                                <div className="mb-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-sm">
                                                    ✅ Copied! Paste into Claude to generate your proposal.
                                                </div>
                                            )}

                                            <div className="flex flex-col sm:flex-row justify-between gap-3 mb-4">
                                                <div>
                                                    <h3 className="text-lg font-bold text-slate-800">Your Grant Writing Prompt</h3>
                                                    <p className="text-xs text-slate-500">{generatedPrompt.length.toLocaleString()} characters</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => { navigator.clipboard?.writeText(generatedPrompt); setCopySuccess(true); setTimeout(() => setCopySuccess(false), 3000); }}
                                                        className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium">📋 Copy</button>
                                                    <button onClick={downloadPrompt} className="px-4 py-2 bg-slate-100 rounded-lg text-sm">⬇️ Download</button>
                                                </div>
                                            </div>

                                            <div className="bg-slate-900 rounded-xl p-4 max-h-[350px] overflow-y-auto">
                                                <pre className="text-slate-100 text-xs whitespace-pre-wrap font-mono">{generatedPrompt}</pre>
                                            </div>

                                            <div className="mt-4 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 rounded-xl">
                                                <h4 className="font-bold text-indigo-800 mb-2">🚀 Next Steps:</h4>
                                                <ol className="text-indigo-700 text-sm space-y-1 list-decimal list-inside">
                                                    <li>Open <a href="https://claude.ai" target="_blank" className="underline">claude.ai</a></li>
                                                    <li>Start new conversation, paste prompt</li>
                                                    <li>Wait for complete proposal (~2-5 minutes)</li>
                                                    <li>Review and customize with specific data</li>
                                                    <li>Format per funder requirements and submit!</li>
                                                </ol>
                                            </div>

                                            <button onClick={() => { setActiveTab('documents'); setGeneratedPrompt(''); }}
                                                className="mt-4 w-full py-3 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200">
                                                ← Create Another Proposal
                                            </button>
                                        </>
                                    ) : (
                                        <div className="text-center py-12">
                                            <div className="text-5xl mb-4">📝</div>
                                            <h3 className="text-xl font-bold text-slate-700 mb-2">No Prompt Yet</h3>
                                            <p className="text-slate-500 mb-4">Complete the previous steps to generate.</p>
                                            <button onClick={() => setActiveTab('documents')} className="px-6 py-2 bg-indigo-600 text-white rounded-lg">Get Started</button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {error && <div className="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">⚠️ {error}</div>}
                        </div>

                        {/* Features Footer */}
                        <div className="mt-6 grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 no-print">
                            {[
                                { t: '60+ Grant Types', d: 'All sectors' },
                                { t: '16 Funder Presets', d: 'USAID, EU, UN...' },
                                { t: '30 Yrs Expertise', d: 'Built-in AI' },
                                { t: 'Auto-Save', d: 'Never lose work' }
                            ].map((f, i) => (
                                <div key={i} className="bg-slate-800/50 p-3 rounded-xl text-center">
                                    <h3 className="font-semibold text-white text-xs sm:text-sm">{f.t}</h3>
                                    <p className="text-[10px] sm:text-xs text-slate-400">{f.d}</p>
                                </div>
                            ))}
                        </div>

                        <div className="mt-4 text-center text-slate-500 text-xs no-print">
                            Grant Proposal Writer Pro v4.0
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<GrantProposalWriter />);
    </script>
</body>
</html>
