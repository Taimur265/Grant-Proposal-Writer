        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .tooltip { position: relative; }
        .tooltip:hover .tooltip-text { visibility: visible; opacity: 1; }
        .tooltip-text {
            visibility: hidden; opacity: 0; position: absolute; z-index: 10;
            bottom: 125%; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: white; padding: 8px 12px;
            border-radius: 6px; font-size: 12px; white-space: nowrap;
            transition: opacity 0.2s;
        }
        .tooltip-text::after {
            content: ""; position: absolute; top: 100%; left: 50%;
            margin-left: -5px; border: 5px solid transparent;
            border-top-color: #1e293b;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>

        const SAMPLE_RFP = `SAMPLE GRANT OPPORTUNITY

Organization: International Development Foundation
Grant Title: Community Resilience Program 2024
Funding Available: $50,000 - $250,000
Duration: 12-24 months

ELIGIBILITY:

        const GRANT_WRITER_PROMPT = `You are a world-class grant proposal writer with 25+ years of experience securing funding for diverse organizations globally. You have personally written and reviewed over 1,000 successful proposals that have secured more than $750 million in funding across sectors including climate, SME development, agriculture, education, healthcare, humanitarian aid, and governance.

YOUR CREDENTIALS & EXPERTISE:
- Former Grant Review Panel Member for USAID, EU, and major foundations
- Certified Grant Professional (GPC) with expertise in federal and private funding
- Published author on grant writing best practices
- Deep understanding of funder psychology and evaluation criteria
- Mastery of persuasive writing techniques specific to grant applications
- Expert in logical framework (LogFrame), Theory of Change, and results-based management
- Experience with international donor requirements (USAID, World Bank, EU, GIZ, DFID/FCDO, SIDA, JICA, bilateral donors, private foundations)
- Understanding of cross-cutting themes (gender mainstreaming, environmental sustainability, social inclusion, conflict sensitivity)

CRITICAL ANALYSIS PHASE - DO THIS FIRST:

Before writing, you MUST analyze the grant documents and extract:
1. FUNDER PROFILE: Organization type, strategic priorities, geographic focus
2. ELIGIBILITY: Who can apply, partnership requirements, registration needs
3. FUNDING DETAILS: Amount range, duration, cost-share requirements
4. EVALUATION CRITERIA: Scoring rubric, weighted criteria, review process
5. REQUIRED SECTIONS: Exact sections needed, page/word limits
6. SUBMISSION REQUIREMENTS: Deadlines, format, annexes needed
7. KEY TERMINOLOGY: Funder's preferred language and buzzwords
8. RED FLAGS: Common rejection reasons to avoid

COMPREHENSIVE PROPOSAL STRUCTURE:

A. COVER PAGE & EXECUTIVE SUMMARY (Critical - Reviewers read this first!)
   - Compelling project title that captures essence and impact
   - Applicant details: Organization name, registration, contact person
   - Funding request: Total amount, project duration, cost per beneficiary
   - One-paragraph problem statement with shocking/compelling statistics
   - Solution overview highlighting innovation and unique approach
   - Expected impact: 3-5 key outcome metrics with numbers
   - Geographic scope and beneficiary numbers (direct + indirect)
   - Key partners listed with their specific roles

B. ORGANIZATIONAL BACKGROUND & CAPACITY (Prove you can deliver)
   - Organization founding story and evolution
   - Legal status, registration numbers, governance structure
   - Mission-vision alignment with funder's priorities
   - Track record: Similar projects, success metrics, lessons learned
   - Key personnel: Names, qualifications, % time commitment
   - Organizational chart and reporting structure
   - Financial health: Budget size, audit status, reserves
   - Past donor relationships and performance ratings
   - Awards, recognition, or accreditations

C. NEEDS ASSESSMENT & PROBLEM STATEMENT (Make them feel the urgency)
   - Opening hook: Compelling story or startling statistic
   - Problem description with recent, credible data (cite sources!)
   - Root cause analysis: Problem tree or fishbone diagram approach
   - Geographic and demographic context with specifics
   - Affected population: Who suffers, how many, how severely
   - Consequences of inaction: What happens if nothing changes
   - Gap analysis: Why current solutions are inadequate
   - Stakeholder voices: Quotes from community consultations
   - Alignment with national priorities, SDGs, funder strategy

D. PROJECT DESCRIPTION (Your solution - be specific!)
   - Theory of Change: If we do X, then Y will happen, because Z
   - Logical Framework Matrix with:
     * Goal (long-term impact)
     * Outcomes (medium-term changes)
     * Outputs (deliverables)
     * Activities (what you'll do)
     * Indicators (how you'll measure)
     * Means of Verification (data sources)
     * Assumptions and Risks
   - SMART Objectives: Each must be Specific, Measurable, Achievable, Relevant, Time-bound
   - Detailed methodology for each activity
   - Innovation: What's new or different about your approach
   - Target beneficiaries with selection criteria
   - Geographic targeting rationale
   - Implementation phases and milestones
   - Risk matrix: Risk, Probability, Impact, Mitigation Strategy
   - Cross-cutting themes integration

E. IMPLEMENTATION & MANAGEMENT PLAN
   - Detailed work plan with Gantt chart description
   - Phase 1, 2, 3 breakdown with deliverables
   - Resource requirements: Staff, equipment, materials
   - Procurement approach compliant with funder rules
   - Team structure with clear roles and responsibilities
   - Decision-making processes and escalation procedures
   - Quality assurance mechanisms
   - Stakeholder coordination plan
   - Government engagement strategy
   - Community participation mechanisms

F. MONITORING, EVALUATION & LEARNING (MEL)
   - MEL framework aligned with logical framework
   - Indicator Reference Sheet for each KPI:
     * Indicator definition and calculation
     * Baseline value and target
     * Data source and collection method
     * Frequency and responsible person
   - Data collection tools and methods
   - Data quality assurance procedures
   - Evaluation design: Baseline, midline, endline
   - Learning agenda with key learning questions
   - Adaptive management approach
   - Beneficiary feedback mechanisms
   - Reporting schedule and templates
   - Knowledge management and documentation

G. SUSTAINABILITY & EXIT STRATEGY
   - Financial sustainability: Revenue streams post-grant
   - Institutional sustainability: Local ownership plan
   - Technical sustainability: Capacity building, technology transfer
   - Social sustainability: Behavior change, community ownership
   - Environmental sustainability: Climate-proofing
   - Exit strategy with specific handover timeline
   - Scaling potential and replication plan
   - Policy influence and systems change

H. BUDGET & BUDGET NARRATIVE
   - Detailed line-item budget by:
     * Activity/Output
     * Budget category (personnel, equipment, travel, etc.)
     * Year (for multi-year projects)
   - Budget narrative justifying EVERY significant cost
   - Unit cost calculations shown
   - Cost-effectiveness comparison with alternatives
   - Value for money demonstration
   - Co-funding and matching contributions
   - Indirect cost rate with justification
   - Contingency provisions (if allowed)

I. PARTNERSHIPS & STAKEHOLDERS
   - Partner mapping with roles and responsibilities
   - Partnership agreements (reference MOUs)
   - Coordination mechanisms
   - Community engagement approach
   - Government relationships at all levels
   - Private sector linkages
   - Academic/research partnerships

SECTOR-SPECIFIC EXCELLENCE:

For CLIMATE/ENVIRONMENT grants:
- GHG emission reduction calculations (tons CO2e)
- Climate vulnerability assessments
- Adaptation AND mitigation components
- Paris Agreement/NDC alignment
- Climate co-benefits quantified
- Environmental and Social Impact Assessment

For SME/ECONOMIC grants:
- Job creation metrics (direct, indirect, by gender/youth)
- Market analysis with demand evidence
- Business model viability demonstration
- Investment leverage and crowding-in
- Value chain analysis
- Financial inclusion metrics

For HEALTHCARE grants:
- Health outcome metrics (mortality, morbidity reduction)
- Health system strengthening components
- Community health worker involvement
- Supply chain and logistics
- Quality of care indicators
- Integration with national health systems

For EDUCATION grants:
- Learning outcome measurements
- Enrollment and retention rates
- Teacher training quality metrics
- Curriculum alignment
- Education system integration
- Technology-enhanced learning

For HUMANITARIAN grants:
- Sphere/CHS standards compliance
- Protection mainstreaming
- AAP (Accountability to Affected Populations)
- Cluster coordination
- Do No Harm analysis
- Nexus approach (humanitarian-development-peace)

WRITING EXCELLENCE STANDARDS:
- Active voice, strong verbs
- Specific numbers, not vague claims
- Evidence for every assertion
- Funder's terminology mirrored throughout
- Front-load key information
- One idea per paragraph
- Clear transitions between sections
- Professional but passionate tone
- Proofread for errors

QUALITY ASSURANCE CHECKLIST:
✓ All RFP requirements addressed
✓ Evaluation criteria explicitly covered
✓ Budget matches narrative exactly
✓ Realistic timeline with buffer
✓ All objectives are SMART
✓ Theory of change is logical
✓ Evidence cited properly
✓ Sustainability is credible
✓ Risks have mitigations
✓ M&E framework complete
✓ Page/word limits respected
✓ Required annexes listed
✓ Contact information correct
✓ Signatures/authorizations noted`;

        // Tooltip component
        const Tooltip = ({ text, children }) => (
            <div className="tooltip inline-block">
                {children}
                <span className="tooltip-text">{text}</span>
            </div>
        );

        // Progress indicator component
        const ProgressBar = ({ currentStep, totalSteps }) => (
            <div className="flex items-center gap-2 mb-6">
                {[1, 2, 3].map((step) => (
                    <React.Fragment key={step}>
                        <div className={`w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold transition-all ${
                            step < currentStep ? 'bg-green-500 text-white' :
                            step === currentStep ? 'bg-indigo-600 text-white' :
                            'bg-slate-200 text-slate-500'
                        }`}>
                            {step < currentStep ? '✓' : step}
                        </div>
                        {step < 3 && (
                            <div className={`flex-1 h-1 rounded ${
                                step < currentStep ? 'bg-green-500' : 'bg-slate-200'
                            }`} />
                        )}
                    </React.Fragment>
                ))}
            </div>
        );

        function GrantProposalWriter() {
            const [inputMode, setInputMode] = useState('paste');
            const [files, setFiles] = useState([]);
            const [pastedText, setPastedText] = useState('');
            const [proposalType, setProposalType] = useState('standard');
            const [projectTitle, setProjectTitle] = useState('');
            const [orgDetails, setOrgDetails] = useState({
                name: '',
                mission: '',
                location: '',
                budgetRequest: '',
                projectDuration: '',
                beneficiaries: '',
                experience: '',
                website: ''
            });
            const [additionalContext, setAdditionalContext] = useState('');
            const [generatedPrompt, setGeneratedPrompt] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [copySuccess, setCopySuccess] = useState(false);
            const [error, setError] = useState('');
            const [isDragging, setIsDragging] = useState(false);
            const [showPreview, setShowPreview] = useState(false);
            const [activeTab, setActiveTab] = useState('input');
            const [showSample, setShowSample] = useState(false);
            const [savedNotice, setSavedNotice] = useState(false);
            const fileInputRef = useRef(null);

            // Auto-save to localStorage
            useEffect(() => {
                const saved = localStorage.getItem('grantProposalDraft');
                if (saved) {
                    try {
                        const data = JSON.parse(saved);
                        if (data.pastedText) setPastedText(data.pastedText);
                        if (data.proposalType) setProposalType(data.proposalType);
                        if (data.projectTitle) setProjectTitle(data.projectTitle);
                        if (data.orgDetails) setOrgDetails(data.orgDetails);
                        if (data.additionalContext) setAdditionalContext(data.additionalContext);
                    } catch (e) {
                        console.error('Error loading saved draft:', e);
                    }
                }
            }, []);

            useEffect(() => {
                const data = { pastedText, proposalType, projectTitle, orgDetails, additionalContext };
                localStorage.setItem('grantProposalDraft', JSON.stringify(data));
            }, [pastedText, proposalType, projectTitle, orgDetails, additionalContext]);

            const saveProgress = () => {
                setSavedNotice(true);
                setTimeout(() => setSavedNotice(false), 2000);
            };

            // Drag and drop handlers
            const handleDrag = useCallback((e) => { e.preventDefault(); e.stopPropagation(); }, []);
            const handleDragIn = useCallback((e) => {
                e.preventDefault(); e.stopPropagation();
                if (e.dataTransfer.items?.length > 0) setIsDragging(true);
            }, []);
            const handleDragOut = useCallback((e) => { e.preventDefault(); e.stopPropagation(); setIsDragging(false); }, []);
            const handleDrop = useCallback((e) => {
                e.preventDefault(); e.stopPropagation(); setIsDragging(false);
                if (e.dataTransfer.files?.length > 0) handleFilesSelected(Array.from(e.dataTransfer.files));
            }, []);

            const handleFileChange = (e) => handleFilesSelected(Array.from(e.target.files));

            const handleFilesSelected = async (selectedFiles) => {
                const processedFiles = [];
                for (const file of selectedFiles) {
                    if (file.size > 5 * 1024 * 1024) continue;
                    try {
                        let content = await new Promise((resolve, reject) => {
                            const reader = new FileReader();
                            reader.onload = (e) => resolve(e.target.result);
                            reader.onerror = reject;
                            reader.readAsText(file);
                        });

                        let warning = '';
                        if (file.type === 'application/pdf' && (content.includes('%PDF') || /[\x00-\x08\x0E-\x1F]/.test(content.substring(0, 500)))) {
                            content = `[PDF: ${file.name} - Please copy/paste text manually]`;
                            warning = 'Binary PDF - paste text instead';
                        } else if (file.name.endsWith('.docx') && content.includes('PK')) {
                            content = `[Word: ${file.name} - Please copy/paste text manually]`;
                            warning = 'Binary DOCX - paste text instead';
                        }
                        processedFiles.push({ name: file.name, size: file.size, content, warning });
                    } catch (err) { console.error(err); }
                }
                setFiles(prev => [...prev, ...processedFiles]);
            };

            const getCharCount = () => inputMode === 'upload'
                ? files.reduce((acc, f) => acc + (f.content?.length || 0), 0)
                : pastedText.length;

            const getWordCount = () => {
                const text = inputMode === 'upload'
                    ? files.map(f => f.content).join(' ')
                    : pastedText;
                return text.split(/\s+/).filter(w => w).length;
            };

            const getCompletionPercent = () => {
                let score = 0;
                if (getCharCount() > 100) score += 40;
                if (projectTitle) score += 15;
                if (orgDetails.name) score += 15;
                if (orgDetails.location) score += 10;
                if (orgDetails.budgetRequest) score += 10;
                if (orgDetails.beneficiaries) score += 10;
                return Math.min(score, 100);
            };

            const clearAll = () => {
                setFiles([]); setPastedText(''); setProjectTitle('');
                setOrgDetails({ name: '', mission: '', location: '', budgetRequest: '', projectDuration: '', beneficiaries: '', experience: '', website: '' });
                setAdditionalContext(''); setGeneratedPrompt(''); setError(''); setCopySuccess(false);
                localStorage.removeItem('grantProposalDraft');
            };

            const loadSample = () => {
                setPastedText(SAMPLE_RFP);
                setShowSample(false);
            };

            const getProposalTypeLabel = () => PROPOSAL_TYPES.find(t => t.value === proposalType)?.label || 'Grant Proposal';

            const generatePrompt = () => {
                setIsGenerating(true);
                setError('');

                const documentContent = inputMode === 'upload'
                    ? files.map(f => `\n--- ${f.name} ---\n${f.content}`).join('\n\n')
                    : pastedText;

                if (!documentContent.trim()) {
                    setError('Please provide grant documents.');
                    setIsGenerating(false);
                    return;
                }

                const orgContext = [];
                if (projectTitle) orgContext.push(`Project Title: ${projectTitle}`);
                if (orgDetails.name) orgContext.push(`Organization: ${orgDetails.name}`);
                if (orgDetails.mission) orgContext.push(`Mission: ${orgDetails.mission}`);
                if (orgDetails.location) orgContext.push(`Location/Focus: ${orgDetails.location}`);
                if (orgDetails.budgetRequest) orgContext.push(`Budget Request: ${orgDetails.budgetRequest}`);
                if (orgDetails.projectDuration) orgContext.push(`Duration: ${orgDetails.projectDuration}`);
                if (orgDetails.beneficiaries) orgContext.push(`Target Beneficiaries: ${orgDetails.beneficiaries}`);
                if (orgDetails.experience) orgContext.push(`Relevant Experience: ${orgDetails.experience}`);
                if (orgDetails.website) orgContext.push(`Website: ${orgDetails.website}`);
                if (additionalContext) orgContext.push(`Additional Notes: ${additionalContext}`);

                const fullPrompt = `${GRANT_WRITER_PROMPT}

═══════════════════════════════════════════════════════════════════
GRANT DOCUMENTS TO ANALYZE:
═══════════════════════════════════════════════════════════════════

${documentContent}

═══════════════════════════════════════════════════════════════════
APPLICANT INFORMATION:
═══════════════════════════════════════════════════════════════════

${orgContext.length > 0 ? orgContext.join('\n') : 'Not provided - use best practices and ask clarifying questions.'}

Proposal Type: ${getProposalTypeLabel()}

═══════════════════════════════════════════════════════════════════
YOUR TASK:
═══════════════════════════════════════════════════════════════════

Write a COMPLETE, SUBMISSION-READY ${getProposalTypeLabel()} based on the documents above.

REQUIRED ACTIONS:
1. ANALYZE the RFP thoroughly - identify ALL requirements, criteria, and funder priorities
2. CREATE detailed outline addressing every required section
3. WRITE each section with compelling, evidence-based content
4. ALIGN language with funder's terminology and strategic priorities
5. INCLUDE specific metrics, targets, and outcomes throughout
6. PROVIDE realistic timelines, budgets, and implementation details
7. ADDRESS sustainability, risks, and cross-cutting themes
8. FORMAT professionally with clear headers and structure

OUTPUT: Complete proposal ready for submission with minimal editing. Include all sections, be specific with numbers and timelines, and ensure every evaluation criterion is explicitly addressed.

BEGIN WRITING THE COMPLETE PROPOSAL NOW:`;

                setGeneratedPrompt(fullPrompt);
                setActiveTab('output');

                // Copy to clipboard
                navigator.clipboard?.writeText(fullPrompt).then(() => {
                    setCopySuccess(true);
                    setTimeout(() => setCopySuccess(false), 4000);
                }).catch(() => {
                    // Fallback
                    const ta = document.createElement('textarea');
                    ta.value = fullPrompt;
                    ta.style.cssText = 'position:fixed;left:-9999px';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    setCopySuccess(true);
                    setTimeout(() => setCopySuccess(false), 4000);
                });

                setIsGenerating(false);
            };

            const downloadPrompt = () => {
                const blob = new Blob([generatedPrompt], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `grant-prompt-${proposalType}-${Date.now()}.txt`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const groupedTypes = PROPOSAL_TYPES.reduce((acc, type) => {
                if (!acc[type.category]) acc[type.category] = [];
                acc[type.category].push(type);
                return acc;
            }, {});

            const currentStep = activeTab === 'input' ? 1 : activeTab === 'details' ? 2 : 3;

            return (
                <div className="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 p-4 md:p-6">
                    <div className="max-w-5xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-6">
                            <h1 className="text-3xl md:text-4xl font-bold text-white mb-2">
                                Grant Proposal Writer <span className="text-indigo-400">Pro</span>
                            </h1>
                            <p className="text-slate-400">
                                AI-powered grant writing with 25+ years of expertise built-in
                            </p>
                            {savedNotice && (
                                <span className="inline-block mt-2 text-green-400 text-sm animate-pulse">
                                    ✓ Progress saved
                                </span>
                            )}
                        </div>

                        {/* Progress Bar */}
                        <div className="bg-slate-800/50 rounded-xl p-4 mb-4">
                            <ProgressBar currentStep={currentStep} totalSteps={3} />
                            <div className="flex justify-between text-xs text-slate-400">
                                <span>Grant Documents</span>
                                <span>Organization Info</span>
                                <span>Generated Prompt</span>
                            </div>
                        </div>

                        {/* Tab Navigation */}
                        <div className="flex mb-4 bg-slate-800 rounded-lg p-1">
                            {[
                                { id: 'input', label: '1. Documents', icon: '📄' },
                                { id: 'details', label: '2. Details', icon: '🏢' },
                                { id: 'output', label: '3. Output', icon: '✨' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    disabled={tab.id === 'output' && !generatedPrompt}
                                    className={`flex-1 py-2.5 px-3 rounded-md font-medium transition-all text-sm ${
                                        activeTab === tab.id
                                            ? 'bg-indigo-600 text-white'
                                            : 'text-slate-400 hover:text-white hover:bg-slate-700'
                                    } disabled:opacity-40 disabled:cursor-not-allowed`}
                                >
                                    <span className="hidden sm:inline">{tab.icon} </span>{tab.label}
                                </button>
                            ))}
                        </div>

                        {/* Main Card */}
                        <div className="bg-white rounded-2xl shadow-2xl p-6 md:p-8">
                            {/* Tab 1: Documents */}
                            {activeTab === 'input' && (
                                <div>
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-lg font-bold text-slate-800">Grant Documents</h2>
                                        <div className="flex gap-2">
                                            <button onClick={() => setShowSample(true)} className="text-sm text-indigo-600 hover:text-indigo-800">
                                                View Sample RFP
                                            </button>
                                            <button onClick={clearAll} className="text-sm text-red-500 hover:text-red-700">
                                                Clear All
                                            </button>
                                        </div>
                                    </div>

                                    {/* Sample Modal */}
                                    {showSample && (
                                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                                            <div className="bg-white rounded-xl max-w-2xl w-full max-h-[80vh] overflow-auto p-6">
                                                <div className="flex justify-between items-center mb-4">
                                                    <h3 className="font-bold text-lg">Sample RFP Format</h3>
                                                    <button onClick={() => setShowSample(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                                                </div>
                                                <pre className="bg-slate-100 p-4 rounded-lg text-sm whitespace-pre-wrap font-mono">{SAMPLE_RFP}</pre>
                                                <div className="flex gap-2 mt-4">
                                                    <button onClick={loadSample} className="flex-1 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                                                        Use This Sample
                                                    </button>
                                                    <button onClick={() => setShowSample(false)} className="flex-1 py-2 bg-slate-200 rounded-lg hover:bg-slate-300">
                                                        Close
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Input Mode Toggle */}
                                    <div className="flex gap-2 mb-4">
                                        <button
                                            onClick={() => setInputMode('paste')}
                                            className={`flex-1 py-2.5 px-4 rounded-lg font-medium transition-all ${
                                                inputMode === 'paste' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                            }`}
                                        >
                                            ✏️ Paste Text
                                        </button>
                                        <button
                                            onClick={() => setInputMode('upload')}
                                            className={`flex-1 py-2.5 px-4 rounded-lg font-medium transition-all ${
                                                inputMode === 'upload' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                            }`}
                                        >
                                            📁 Upload Files
                                        </button>
                                    </div>

                                    {inputMode === 'paste' ? (
                                        <div>
                                            <textarea
                                                value={pastedText}
                                                onChange={(e) => setPastedText(e.target.value)}
                                                placeholder="Paste your RFP, grant guidelines, eligibility criteria, evaluation rubric, and any other relevant documents here...

The more detail you provide, the better your proposal will be!"
                                                className="w-full h-56 p-4 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-y font-mono text-sm"
                                            />
                                            <div className="flex justify-between mt-2 text-sm text-slate-500">
                                                <span>{pastedText.length.toLocaleString()} characters</span>
                                                <span>{pastedText.split(/\s+/).filter(w => w).length.toLocaleString()} words</span>
                                            </div>
                                        </div>
                                    ) : (
                                        <div>
                                            <div className="bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4 text-sm text-amber-800">
                                                <strong>Tip:</strong> Plain text (.txt) files work best. For PDF/Word, copy-paste is recommended.
                                            </div>
                                            <div
                                                onClick={() => fileInputRef.current?.click()}
                                                onDragEnter={handleDragIn}
                                                onDragLeave={handleDragOut}
                                                onDragOver={handleDrag}
                                                onDrop={handleDrop}
                                                className={`border-2 border-dashed rounded-xl p-8 text-center cursor-pointer transition-all ${
                                                    isDragging ? 'border-indigo-500 bg-indigo-50' : 'border-slate-300 hover:border-indigo-400'
                                                }`}
                                            >
                                                <div className="text-3xl mb-2">{isDragging ? '📥' : '📁'}</div>
                                                <p className="text-slate-600">{isDragging ? 'Drop files here' : 'Click or drag to upload'}</p>
                                            </div>
                                            <input ref={fileInputRef} type="file" multiple accept=".txt,.pdf,.doc,.docx" onChange={handleFileChange} className="hidden" />
                                            {files.length > 0 && (
                                                <div className="mt-4 space-y-2">
                                                    {files.map((file, i) => (
                                                        <div key={i} className="flex items-center justify-between bg-slate-50 p-3 rounded-lg">
                                                            <span className="text-sm">{file.warning ? '⚠️' : '✓'} {file.name}</span>
                                                            <button onClick={() => setFiles(files.filter((_, j) => j !== i))} className="text-red-500 text-sm">Remove</button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Proposal Type */}
                                    <div className="mt-6">
                                        <label className="block text-sm font-semibold text-slate-700 mb-2">
                                            Proposal Type
                                            <Tooltip text="Select the type that best matches your grant opportunity">
                                                <span className="ml-1 text-slate-400 cursor-help">ⓘ</span>
                                            </Tooltip>
                                        </label>
                                        <select
                                            value={proposalType}
                                            onChange={(e) => setProposalType(e.target.value)}
                                            className="w-full p-3 border-2 border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-500"
                                        >
                                            {Object.entries(groupedTypes).map(([category, types]) => (
                                                <optgroup key={category} label={`─ ${category} ─`}>
                                                    {types.map(type => (
                                                        <option key={type.value} value={type.value}>{type.label}</option>
                                                    ))}
                                                </optgroup>
                                            ))}
                                        </select>
                                    </div>

                                    <div className="flex gap-3 mt-6">
                                        <button
                                            onClick={() => setActiveTab('details')}
                                            className="flex-1 py-3 bg-indigo-600 text-white font-semibold rounded-xl hover:bg-indigo-700 transition-all"
                                        >
                                            Continue to Details →
                                        </button>
                                        <button
                                            onClick={generatePrompt}
                                            disabled={getCharCount() < 50}
                                            className="py-3 px-6 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed"
                                        >
                                            Quick Generate
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Tab 2: Details */}
                            {activeTab === 'details' && (
                                <div>
                                    <div className="flex items-center justify-between mb-4">
                                        <h2 className="text-lg font-bold text-slate-800">Organization Details</h2>
                                        <div className="text-sm text-slate-500">
                                            Completion: <span className="font-semibold text-indigo-600">{getCompletionPercent()}%</span>
                                        </div>
                                    </div>
                                    <p className="text-sm text-slate-500 mb-6">
                                        More details = better customized proposal. All fields optional but recommended.
                                    </p>

                                    {/* Project Title - Important! */}
                                    <div className="mb-6 p-4 bg-indigo-50 rounded-xl">
                                        <label className="block text-sm font-semibold text-indigo-800 mb-2">
                                            Project Title (Important!)
                                            <Tooltip text="A compelling title captures attention and communicates your project's essence">
                                                <span className="ml-1 cursor-help">ⓘ</span>
                                            </Tooltip>
                                        </label>
                                        <input
                                            type="text"
                                            value={projectTitle}
                                            onChange={(e) => setProjectTitle(e.target.value)}
                                            placeholder="e.g., 'Empowering Rural Women Through Climate-Smart Agriculture'"
                                            className="w-full p-3 border-2 border-indigo-200 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div className="grid md:grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Organization Name</label>
                                            <input
                                                type="text"
                                                value={orgDetails.name}
                                                onChange={(e) => setOrgDetails({...orgDetails, name: e.target.value})}
                                                placeholder="Your Organization Name"
                                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Geographic Focus</label>
                                            <input
                                                type="text"
                                                value={orgDetails.location}
                                                onChange={(e) => setOrgDetails({...orgDetails, location: e.target.value})}
                                                placeholder="e.g., East Africa, Kenya, Nairobi County"
                                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Budget Request</label>
                                            <input
                                                type="text"
                                                value={orgDetails.budgetRequest}
                                                onChange={(e) => setOrgDetails({...orgDetails, budgetRequest: e.target.value})}
                                                placeholder="e.g., $150,000 USD"
                                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-slate-700 mb-1">Project Duration</label>
                                            <input
                                                type="text"
                                                value={orgDetails.projectDuration}
                                                onChange={(e) => setOrgDetails({...orgDetails, projectDuration: e.target.value})}
                                                placeholder="e.g., 18 months"
                                                className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                            />
                                        </div>
                                    </div>

                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Target Beneficiaries</label>
                                        <input
                                            type="text"
                                            value={orgDetails.beneficiaries}
                                            onChange={(e) => setOrgDetails({...orgDetails, beneficiaries: e.target.value})}
                                            placeholder="e.g., 5,000 smallholder farmers (60% women) in 3 districts"
                                            className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500"
                                        />
                                    </div>

                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Organization Mission & Background</label>
                                        <textarea
                                            value={orgDetails.mission}
                                            onChange={(e) => setOrgDetails({...orgDetails, mission: e.target.value})}
                                            placeholder="Brief description of your organization's mission, history, and key achievements..."
                                            className="w-full h-20 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 resize-y"
                                        />
                                    </div>

                                    <div className="mb-4">
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Relevant Experience</label>
                                        <textarea
                                            value={orgDetails.experience}
                                            onChange={(e) => setOrgDetails({...orgDetails, experience: e.target.value})}
                                            placeholder="Previous similar projects, grants managed, success metrics..."
                                            className="w-full h-20 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 resize-y"
                                        />
                                    </div>

                                    <div className="mb-6">
                                        <label className="block text-sm font-medium text-slate-700 mb-1">Additional Context</label>
                                        <textarea
                                            value={additionalContext}
                                            onChange={(e) => setAdditionalContext(e.target.value)}
                                            placeholder="Partners, special requirements, specific outcomes, innovation aspects..."
                                            className="w-full h-20 p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 resize-y"
                                        />
                                    </div>

                                    <div className="flex gap-3">
                                        <button onClick={() => setActiveTab('input')} className="py-3 px-6 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200">
                                            ← Back
                                        </button>
                                        <button
                                            onClick={generatePrompt}
                                            disabled={getCharCount() < 50}
                                            className="flex-1 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-bold rounded-xl hover:from-indigo-700 hover:to-purple-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg"
                                        >
                                            ✨ Generate Proposal Prompt
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* Tab 3: Output */}
                            {activeTab === 'output' && (
                                <div>
                                    {generatedPrompt ? (
                                        <>
                                            {copySuccess && (
                                                <div className="mb-4 p-4 bg-green-50 border border-green-200 rounded-xl text-green-700">
                                                    ✅ Copied to clipboard! Paste into Claude to generate your proposal.
                                                </div>
                                            )}

                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                                                <div>
                                                    <h3 className="text-lg font-bold text-slate-800">Your Grant Writing Prompt</h3>
                                                    <p className="text-sm text-slate-500">{generatedPrompt.length.toLocaleString()} chars | {getProposalTypeLabel()}</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <button
                                                        onClick={() => navigator.clipboard?.writeText(generatedPrompt).then(() => { setCopySuccess(true); setTimeout(() => setCopySuccess(false), 3000); })}
                                                        className="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 text-sm font-medium"
                                                    >
                                                        📋 Copy
                                                    </button>
                                                    <button onClick={downloadPrompt} className="px-4 py-2 bg-slate-100 rounded-lg hover:bg-slate-200 text-sm font-medium">
                                                        ⬇️ Download
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="bg-slate-900 rounded-xl p-4 max-h-[350px] overflow-y-auto">
                                                <pre className="text-slate-100 text-xs sm:text-sm whitespace-pre-wrap font-mono leading-relaxed">{generatedPrompt}</pre>
                                            </div>

                                            <div className="mt-4 p-4 bg-gradient-to-r from-indigo-50 to-purple-50 border border-indigo-200 rounded-xl">
                                                <h4 className="font-bold text-indigo-800 mb-2">🚀 Next Steps:</h4>
                                                <ol className="text-indigo-700 text-sm space-y-1.5 list-decimal list-inside">
                                                    <li>Open <a href="https://claude.ai" target="_blank" rel="noopener noreferrer" className="underline font-medium">claude.ai</a></li>
                                                    <li>Start new conversation, paste prompt (Ctrl+V)</li>
                                                    <li>Wait for complete proposal generation</li>
                                                    <li>Review, customize with specific data</li>
                                                    <li>Format according to funder requirements</li>
                                                </ol>
                                            </div>

                                            <button onClick={() => { setActiveTab('input'); setGeneratedPrompt(''); }} className="mt-4 w-full py-3 bg-slate-100 text-slate-700 font-medium rounded-xl hover:bg-slate-200">
                                                ← Create Another Proposal
                                            </button>
                                        </>
                                    ) : (
                                        <div className="text-center py-12">
                                            <div className="text-5xl mb-4">📝</div>
                                            <h3 className="text-xl font-bold text-slate-700 mb-2">No Prompt Yet</h3>
                                            <p className="text-slate-500 mb-4">Add grant documents and generate your prompt.</p>
                                            <button onClick={() => setActiveTab('input')} className="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                                                Get Started
                                            </button>
                                        </div>
                                    )}
                                </div>
                            )}

                            {error && (
                                <div className="mt-4 p-4 bg-red-50 border border-red-200 rounded-xl text-red-700">
                                    ⚠️ {error}
                                </div>
                            )}
                        </div>

                        {/* Features */}
                        <div className="mt-6 grid grid-cols-2 md:grid-cols-4 gap-3">
                            {[
                                { title: '45+ Grant Types', desc: 'All sectors covered' },
                                { title: '25+ Years Expertise', desc: 'Built into AI prompt' },
                                { title: 'Auto-Save', desc: 'Never lose progress' },
                                { title: 'Funder-Aligned', desc: 'Matches their language' }
                            ].map((f, i) => (
                                <div key={i} className="bg-slate-800/50 p-4 rounded-xl text-center">
                                    <h3 className="font-semibold text-white text-sm">{f.title}</h3>
                                    <p className="text-xs text-slate-400">{f.desc}</p>
                                </div>
                            ))}
                        </div>

                        <div className="mt-6 text-center text-slate-500 text-sm">
                            Grant Proposal Writer Pro v3.0
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<GrantProposalWriter />);
    </script>
</body>
</html>
