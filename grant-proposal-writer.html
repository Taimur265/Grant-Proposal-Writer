            const [stakeholders, setStakeholders] = useState([{ name: '', type: '', interest: '', influence: '', engagement: '' }]);

            const [evaluationScores, setEvaluationScores] = useState({});

            const [budgetItems, setBudgetItems] = useState([{ category: '', item: '', amount: '', justification: '' }]);
            const [costShare, setCostShare] = useState('');
            const [costShareSource, setCostShareSource] = useState('');

            // Work Plan
            const [workPlanItems, setWorkPlanItems] = useState([{ activity: '', q1: false, q2: false, q3: false, q4: false, responsible: '' }]);

            // Other
            const [selectedSDGs, setSelectedSDGs] = useState([]);
            const [deadline, setDeadline] = useState('');

                const saved = localStorage.getItem('grantProposalData_v6');

                            if (setters[k] && d[k] !== undefined) setters[k](d[k]);
                        });
                    } catch (e) { console.log('Error loading'); }
                }
            }, []);

                const data = { manualContent, proposalType, selectedFunder, projectTitle, currency, orgName, orgLocation, orgYearFounded, orgRegistration, budgetRequest, projectDuration, targetBeneficiaries, missionStatement, additionalContext, targetCountries, teamMembers, partners, pastProjects, theoryOfChange, problemStatement, logFrameGoal, logFrameOutcomes, logFrameOutputs, risks, stakeholders, meIndicators, budgetItems, costShare, costShareSource, workPlanItems, selectedSDGs, deadline, wordLimit, checkedAttachments };

            }, [manualContent, proposalType, selectedFunder, projectTitle, currency, orgName, orgLocation, orgYearFounded, orgRegistration, budgetRequest, projectDuration, targetBeneficiaries, missionStatement, additionalContext, targetCountries, teamMembers, partners, pastProjects, theoryOfChange, problemStatement, logFrameGoal, logFrameOutcomes, logFrameOutputs, risks, stakeholders, meIndicators, budgetItems, costShare, costShareSource, workPlanItems, selectedSDGs, deadline, wordLimit, checkedAttachments]);

            const handleFileSelect = (e) => {
                Array.from(e.target.files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const content = ev.target.result;
                        if (content.includes('%PDF') || content.includes('PK') || /[\x00-\x08]/.test(content.slice(0,500))) {
                            alert(`"${file.name}" is binary. Convert to .txt first.`);
                        }
                        setFiles(prev => [...prev, { name: file.name, content, size: file.size }]);
                    };
                    reader.readAsText(file);
                });
            };

            const getCurrencySymbol = () => CURRENCIES.find(c => c.code === currency)?.symbol || '$';
            const getTotalBudget = () => budgetItems.reduce((s, i) => s + (parseFloat(i.amount) || 0), 0);
            const getDeadlineInfo = () => {
                if (!deadline) return null;
                const diff = Math.ceil((new Date(deadline) - new Date()) / (1000 * 60 * 60 * 24));
                return { days: diff, date: new Date(deadline).toLocaleDateString() };
            };
            const getWordCount = () => (manualContent + additionalContext + theoryOfChange + problemStatement).split(/\s+/).filter(w => w).length;
            const getCompletionPercentage = () => {
                let f = 0, t = 12;
                if (manualContent || files.length) f++;
                if (projectTitle) f++;
                if (orgName) f++;
                if (budgetRequest) f++;
                if (targetCountries.length) f++;
                if (theoryOfChange) f++;
                if (problemStatement) f++;
                if (logFrameGoal) f++;
                if (logFrameOutcomes.some(o => o.outcome)) f++;
                if (risks.some(r => r.risk)) f++;
                if (meIndicators.some(m => m.indicator)) f++;
                if (budgetItems.some(b => b.item)) f++;
                return Math.round((f / t) * 100);
            };
            const getSelfEvaluationScore = () => {
                let tw = 0, ws = 0;
                EVALUATION_CRITERIA.forEach(c => { if (evaluationScores[c.id]) { ws += (evaluationScores[c.id] / 5) * c.weight; tw += c.weight; } });
                return tw > 0 ? Math.round((ws / tw) * 100) : 0;
            };

            const addCountry = (c) => { if (c && !targetCountries.includes(c)) { setTargetCountries([...targetCountries, c]); setCountrySearch(''); } };
            const removeCountry = (c) => setTargetCountries(targetCountries.filter(x => x !== c));

            // Array helpers
            const addItem = (setter, template) => setter(p => [...p, template]);
            const removeItem = (setter, i) => setter(p => p.filter((_, j) => j !== i));
            const updateItem = (setter, i, field, value) => setter(p => { const u = [...p]; u[i][field] = value; return u; });

            const clearAll = () => {
                if (window.confirm('Clear all data?')) {
                    localStorage.removeItem('grantProposalData_v6');
                    window.location.reload();
                }
            };

                const docContent = inputMode === 'paste' ? manualContent : files.map(f => `--- ${f.name} ---\n${f.content}`).join('\n\n');
                if (!docContent.trim()) { alert('Please provide grant document content.'); return; }

                const typeLabel = PROPOSAL_TYPES.find(t => t.value === proposalType)?.label || 'Grant Proposal';
                const funderInfo = FUNDER_PRESETS.find(f => f.value === selectedFunder);
                const sdgNames = selectedSDGs.map(id => SDG_GOALS.find(g => g.id === id)?.name).filter(Boolean);
                const deadlineInfo = getDeadlineInfo();
                const sym = getCurrencySymbol();

                const prompt = `You are an expert grant proposal writer with 30+ years securing funding from major donors. You've served on review panels for USAID, EU, World Bank. 75%+ success rate.

## TASK
Write a comprehensive, submission-ready ${typeLabel}.

## GRANT DOCUMENTS
${docContent}

## PROJECT OVERVIEW
${projectTitle ? `**Project Title:** ${projectTitle}` : ''}
${orgName ? `**Organization:** ${orgName}${orgYearFounded ? ` (Est. ${orgYearFounded})` : ''}` : ''}

                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Theory of Change *</label>
                                        <textarea value={theoryOfChange} onChange={e => setTheoryOfChange(e.target.value)} placeholder="IF we do [activities], THEN [outputs] will result, BECAUSE [assumptions], LEADING TO [outcomes/impact]..." className="w-full h-32 bg-slate-700 rounded px-3 py-2 text-sm resize-y" />
                                    </div>
                                    <div className="bg-indigo-900/20 rounded p-3 text-xs">
                                        <strong>Theory of Change Template:</strong>
                                        <p className="mt-1 text-slate-400">IF [organization] implements [intervention/activities] targeting [beneficiaries], THEN [immediate outputs] will be achieved, BECAUSE [causal assumptions], LEADING TO [intermediate outcomes], WHICH CONTRIBUTES TO [long-term impact/goal].</p>
                                    </div>
                                </div>
                            )}

                            {/* Tab 4: LogFrame */}
                            {activeTab === 4 && (
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold">📊 Logical Framework</h2>
                                    <div>
                                        <label className="block text-xs text-slate-400 mb-1">Goal / Impact</label>
                                        <input type="text" value={logFrameGoal} onChange={e => setLogFrameGoal(e.target.value)} placeholder="Long-term change the project contributes to" className="w-full bg-slate-700 rounded px-3 py-2 text-sm" />
                                    </div>

                                    <h3 className="font-medium">Outcomes</h3>
                                    {logFrameOutcomes.map((o, i) => (
                                        <div key={i} className="p-3 bg-slate-700/30 rounded space-y-2">
                                            <div className="flex justify-between"><span className="text-xs text-indigo-400">Outcome {i+1}</span>{logFrameOutcomes.length > 1 && <button onClick={() => removeItem(setLogFrameOutcomes, i)} className="text-red-400 text-xs">Remove</button>}</div>
                                            <input type="text" value={o.outcome} onChange={e => updateItem(setLogFrameOutcomes, i, 'outcome', e.target.value)} placeholder="Outcome statement" className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            <input type="text" value={o.indicators} onChange={e => updateItem(setLogFrameOutcomes, i, 'indicators', e.target.value)} placeholder="Indicators" className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            <input type="text" value={o.means} onChange={e => updateItem(setLogFrameOutcomes, i, 'means', e.target.value)} placeholder="Means of Verification" className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            <input type="text" value={o.assumptions} onChange={e => updateItem(setLogFrameOutcomes, i, 'assumptions', e.target.value)} placeholder="Assumptions" className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                        </div>
                                    ))}
                                    <button onClick={() => addItem(setLogFrameOutcomes, { outcome: '', indicators: '', means: '', assumptions: '' })} className="text-indigo-400 text-xs">+ Add Outcome</button>

                                    <h3 className="font-medium mt-4">Outputs & Activities</h3>
                                    {logFrameOutputs.map((o, i) => (
                                        <div key={i} className="p-3 bg-slate-700/30 rounded space-y-2">
                                            <div className="flex justify-between"><span className="text-xs text-emerald-400">Output {i+1}</span>{logFrameOutputs.length > 1 && <button onClick={() => removeItem(setLogFrameOutputs, i)} className="text-red-400 text-xs">Remove</button>}</div>
                                            <input type="text" value={o.output} onChange={e => updateItem(setLogFrameOutputs, i, 'output', e.target.value)} placeholder="Output statement" className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            <input type="text" value={o.activities} onChange={e => updateItem(setLogFrameOutputs, i, 'activities', e.target.value)} placeholder="Activities" className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            <input type="text" value={o.indicators} onChange={e => updateItem(setLogFrameOutputs, i, 'indicators', e.target.value)} placeholder="Indicators" className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                        </div>
                                    ))}
                                    <button onClick={() => addItem(setLogFrameOutputs, { output: '', activities: '', indicators: '' })} className="text-indigo-400 text-xs">+ Add Output</button>

                                    <h3 className="font-medium mt-4">Work Plan</h3>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-xs">
                                            <thead><tr className="text-slate-400"><th className="text-left p-1">Activity</th><th className="p-1">Q1</th><th className="p-1">Q2</th><th className="p-1">Q3</th><th className="p-1">Q4</th><th className="p-1">Responsible</th><th className="p-1"></th></tr></thead>
                                            <tbody>
                                                {workPlanItems.map((w, i) => (
                                                    <tr key={i}>
                                                        <td className="p-1"><input type="text" value={w.activity} onChange={e => updateItem(setWorkPlanItems, i, 'activity', e.target.value)} placeholder="Activity" className="w-full bg-slate-700 rounded px-2 py-1 text-xs" /></td>
                                                        {['q1','q2','q3','q4'].map(q => (
                                                            <td key={q} className="p-1 text-center"><input type="checkbox" checked={w[q]} onChange={e => updateItem(setWorkPlanItems, i, q, e.target.checked)} /></td>
                                                        ))}
                                                        <td className="p-1"><input type="text" value={w.responsible} onChange={e => updateItem(setWorkPlanItems, i, 'responsible', e.target.value)} placeholder="Who" className="w-full bg-slate-700 rounded px-2 py-1 text-xs" /></td>
                                                        <td className="p-1">{workPlanItems.length > 1 && <button onClick={() => removeItem(setWorkPlanItems, i)} className="text-red-400">×</button>}</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <button onClick={() => addItem(setWorkPlanItems, { activity: '', q1: false, q2: false, q3: false, q4: false, responsible: '' })} className="text-indigo-400 text-xs">+ Add Activity</button>
                                </div>
                            )}

                            {/* Tab 5: Risk */}
                            {activeTab === 5 && (
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold">⚠️ Risk Matrix</h2>
                                    {risks.map((r, i) => (
                                        <div key={i} className="grid grid-cols-1 md:grid-cols-5 gap-2 p-2 bg-slate-700/30 rounded">
                                            <input type="text" value={r.risk} onChange={e => updateItem(setRisks, i, 'risk', e.target.value)} placeholder="Risk" className="bg-slate-700 rounded px-2 py-1.5 text-xs md:col-span-2" />
                                            <select value={r.likelihood} onChange={e => updateItem(setRisks, i, 'likelihood', e.target.value)} className="bg-slate-700 rounded px-2 py-1.5 text-xs">
                                                <option value="low">Low</option>
                                                <option value="medium">Medium</option>
                                                <option value="high">High</option>
                                            </select>
                                            <select value={r.impact} onChange={e => updateItem(setRisks, i, 'impact', e.target.value)} className="bg-slate-700 rounded px-2 py-1.5 text-xs">
                                                <option value="low">Low</option>
                                                <option value="medium">Medium</option>
                                                <option value="high">High</option>
                                            </select>
                                            {risks.length > 1 && <button onClick={() => removeItem(setRisks, i)} className="text-red-400 text-xs">Remove</button>}
                                        </div>
                                    ))}
                                    {risks.filter(r => r.risk).map((r, i) => (
                                        <input key={i} type="text" value={r.mitigation} onChange={e => updateItem(setRisks, risks.findIndex(x => x.risk === r.risk), 'mitigation', e.target.value)} placeholder={`Mitigation: ${r.risk.slice(0,30)}...`} className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                    ))}
                                    <button onClick={() => addItem(setRisks, { risk: '', likelihood: 'medium', impact: 'medium', mitigation: '' })} className="text-indigo-400 text-xs">+ Add Risk</button>
                                </div>
                            )}

                            {/* Tab 6: M&E */}
                            {activeTab === 6 && (
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold">📈 M&E Framework</h2>
                                    <h3 className="font-medium">Key Performance Indicators</h3>
                                    {meIndicators.map((m, i) => (
                                        <div key={i} className="p-3 bg-slate-700/30 rounded space-y-2">
                                            <div className="flex justify-between"><span className="text-xs text-emerald-400">KPI {i+1}</span>{meIndicators.length > 1 && <button onClick={() => removeItem(setMeIndicators, i)} className="text-red-400 text-xs">Remove</button>}</div>
                                            <input type="text" value={m.indicator} onChange={e => updateItem(setMeIndicators, i, 'indicator', e.target.value)} placeholder="Indicator" className="w-full bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
                                                <input type="text" value={m.baseline} onChange={e => updateItem(setMeIndicators, i, 'baseline', e.target.value)} placeholder="Baseline" className="bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                                <input type="text" value={m.target} onChange={e => updateItem(setMeIndicators, i, 'target', e.target.value)} placeholder="Target" className="bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                                <input type="text" value={m.frequency} onChange={e => updateItem(setMeIndicators, i, 'frequency', e.target.value)} placeholder="Frequency" className="bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                                <input type="text" value={m.source} onChange={e => updateItem(setMeIndicators, i, 'source', e.target.value)} placeholder="Data Source" className="bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            </div>
                                        </div>
                                    ))}
                                    <button onClick={() => addItem(setMeIndicators, { indicator: '', baseline: '', target: '', frequency: '', source: '' })} className="text-indigo-400 text-xs">+ Add Indicator</button>

                                    <h3 className="font-medium mt-4">Self-Evaluation</h3>
                                    <div className="space-y-2">
                                        {EVALUATION_CRITERIA.map(c => (
                                            <div key={c.id} className="flex items-center gap-3 p-2 bg-slate-700/30 rounded">
                                                <div className="flex-1"><span className="text-xs">{c.label}</span><span className="text-xs text-slate-500 ml-1">({c.weight}%)</span></div>
                                                <div className="flex gap-1">{[1,2,3,4,5].map(s => (
                                                    <button key={s} onClick={() => setEvaluationScores({...evaluationScores, [c.id]: s})} className={`w-6 h-6 rounded text-xs ${evaluationScores[c.id] === s ? 'bg-indigo-600' : 'bg-slate-600'}`}>{s}</button>
                                                ))}</div>
                                            </div>
                                        ))}
                                    </div>
                                    {Object.keys(evaluationScores).length > 0 && (
                                        <div className="p-3 bg-indigo-900/30 rounded text-center">
                                            <span className="text-xs text-slate-400">Score: </span>
                                            <span className={`text-xl font-bold ${getSelfEvaluationScore() >= 80 ? 'text-emerald-400' : getSelfEvaluationScore() >= 60 ? 'text-yellow-400' : 'text-red-400'}`}>{getSelfEvaluationScore()}%</span>
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* Tab 7: Budget */}
                            {activeTab === 7 && (
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold">💰 Budget ({currency})</h2>
                                    {budgetItems.map((b, i) => (
                                        <div key={i} className="grid grid-cols-1 md:grid-cols-5 gap-2 p-2 bg-slate-700/30 rounded">
                                            <select value={b.category} onChange={e => updateItem(setBudgetItems, i, 'category', e.target.value)} className="bg-slate-700 rounded px-2 py-1.5 text-xs">
                                                <option value="">Category</option>
                                                <option value="personnel">Personnel</option>
                                                <option value="travel">Travel</option>
                                                <option value="equipment">Equipment</option>
                                                <option value="activities">Activities</option>
                                                <option value="admin">Admin</option>
                                                <option value="me">M&E</option>
                                                <option value="other">Other</option>
                                            </select>
                                            <input type="text" value={b.item} onChange={e => updateItem(setBudgetItems, i, 'item', e.target.value)} placeholder="Item" className="bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            <input type="number" value={b.amount} onChange={e => updateItem(setBudgetItems, i, 'amount', e.target.value)} placeholder="Amount" className="bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            <input type="text" value={b.justification} onChange={e => updateItem(setBudgetItems, i, 'justification', e.target.value)} placeholder="Justification" className="bg-slate-700 rounded px-2 py-1.5 text-xs" />
                                            {budgetItems.length > 1 && <button onClick={() => removeItem(setBudgetItems, i)} className="text-red-400 text-xs">Remove</button>}
                                        </div>
                                    ))}
                                    <button onClick={() => addItem(setBudgetItems, { category: '', item: '', amount: '', justification: '' })} className="text-indigo-400 text-xs">+ Add Item</button>

                                    {getTotalBudget() > 0 && (
                                        <div className="p-3 bg-emerald-900/30 rounded flex justify-between">
                                            <span>Total:</span>
                                            <span className="text-xl font-bold text-emerald-400">{getCurrencySymbol()}{getTotalBudget().toLocaleString()}</span>
                                        </div>
                                    )}

                                    <h3 className="font-medium mt-4">Cost-Share / Co-Financing</h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                        <input type="text" value={costShare} onChange={e => setCostShare(e.target.value)} placeholder="Cost-Share Amount" className="bg-slate-700 rounded px-3 py-2 text-sm" />
                                        <input type="text" value={costShareSource} onChange={e => setCostShareSource(e.target.value)} placeholder="Source (e.g., In-kind, Partner contribution)" className="bg-slate-700 rounded px-3 py-2 text-sm" />
                                    </div>
                                </div>
                            )}

                            {/* Tab 8: Checklist */}
                            {activeTab === 8 && (
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold">✅ Attachment Checklist</h2>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                        {ATTACHMENT_CHECKLIST.map(a => (
                                            <label key={a.id} className={`flex items-center gap-2 p-2 rounded cursor-pointer text-xs ${checkedAttachments.includes(a.id) ? 'bg-emerald-900/30' : 'bg-slate-700/30'}`}>
                                                <input type="checkbox" checked={checkedAttachments.includes(a.id)} onChange={() => setCheckedAttachments(p => p.includes(a.id) ? p.filter(x => x !== a.id) : [...p, a.id])} />
                                                <span className={checkedAttachments.includes(a.id) ? 'text-emerald-400' : ''}>{a.label}{a.required && <span className="text-red-400 ml-1">*</span>}</span>
                                            </label>
                                        ))}
                                    </div>
                                    <div className="p-3 bg-slate-700/30 rounded">
                                        <div className="flex justify-between text-xs mb-1"><span>Progress</span><span>{checkedAttachments.length}/{ATTACHMENT_CHECKLIST.length}</span></div>
                                        <div className="w-full bg-slate-600 rounded-full h-2"><div className="bg-emerald-500 h-2 rounded-full" style={{width: `${(checkedAttachments.length/ATTACHMENT_CHECKLIST.length)*100}%`}}></div></div>
                                    </div>
                                </div>
                            )}

                            {/* Tab 9: Output */}
                            {activeTab === 9 && (
                                <div className="space-y-4">
                                    <h2 className="text-lg font-semibold">🚀 Generate Proposal</h2>
                                    {!generatedPrompt ? (
                                        <div className="text-center py-8">
                                            <button onClick={generatePrompt} className="bg-gradient-to-r from-indigo-600 to-purple-600 px-6 py-3 rounded-xl font-bold">Generate Grant Proposal Prompt</button>
                                            <p className="text-slate-400 mt-2 text-xs">Click to generate a comprehensive prompt for Claude</p>
                                        </div>
                                    ) : (
                                        <div>
                                            {copySuccess && <div className="bg-emerald-600/20 border border-emerald-500 text-emerald-400 px-3 py-2 rounded text-xs text-center mb-3">✅ Copied! Paste into Claude.</div>}
                                            <div className="bg-slate-900 rounded p-3 max-h-72 overflow-y-auto"><pre className="text-xs text-slate-300 whitespace-pre-wrap">{generatedPrompt}</pre></div>
                                            <div className="flex gap-2 mt-3">
                                                <button onClick={() => { navigator.clipboard.writeText(generatedPrompt); setCopySuccess(true); setTimeout(() => setCopySuccess(false), 3000); }} className="flex-1 bg-indigo-600 py-2 rounded text-sm">📋 Copy</button>
                                                <button onClick={() => { const b = new Blob([generatedPrompt], {type:'text/plain'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'grant-prompt.txt'; a.click(); }} className="bg-slate-700 px-4 py-2 rounded text-sm">💾 Download</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        <div className="flex justify-between mt-4 no-print">
                            <button onClick={() => setActiveTab(Math.max(0, activeTab - 1))} disabled={activeTab === 0} className={`px-4 py-1.5 rounded text-sm ${activeTab === 0 ? 'bg-slate-700 text-slate-500' : 'bg-slate-700 hover:bg-slate-600'}`}>← Prev</button>
                            {activeTab < 9 ? (
                                <button onClick={() => setActiveTab(activeTab + 1)} className="bg-indigo-600 px-4 py-1.5 rounded text-sm">Next →</button>
                            ) : (
                                <button onClick={generatePrompt} className="bg-gradient-to-r from-indigo-600 to-purple-600 px-4 py-1.5 rounded text-sm">Generate</button>
                            )}
                        </div>

                        {/* Modals */}
                        {showModal && (
                            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50" onClick={() => setShowModal(null)}>
                                <div className="bg-slate-800 rounded-xl p-4 max-w-2xl max-h-[80vh] overflow-y-auto" onClick={e => e.stopPropagation()}>
                                    {showModal === 'tips' && (
                                        <>
                                            <h3 className="text-lg font-bold mb-3">💡 Grant Writing Tips</h3>
                                            <div className="space-y-3 text-xs text-slate-300">
                                                <div><strong className="text-emerald-400">1. Read RFP Thoroughly</strong><p>Highlight requirements, criteria, deadlines.</p></div>
                                                <div><strong className="text-emerald-400">2. SMART Objectives</strong><p>Specific, Measurable, Achievable, Relevant, Time-bound.</p></div>
                                                <div><strong className="text-emerald-400">3. Show, Don't Tell</strong><p>Use data and evidence, not claims.</p></div>
                                                <div><strong className="text-emerald-400">4. Budget = Narrative</strong><p>Budget should match your story.</p></div>
                                                <div><strong className="text-emerald-400">5. Address Sustainability</strong><p>Show continuation after funding ends.</p></div>
                                                <div><strong className="text-emerald-400">6. Know Your Funder</strong><p>Align language with funder priorities.</p></div>
                                            </div>
                                        </>
                                    )}
                                    {showModal === 'sample' && (
                                        <>
                                            <h3 className="text-lg font-bold mb-3">📋 Sample RFP</h3>
                                            <pre className="text-xs text-slate-300 whitespace-pre-wrap bg-slate-900 p-3 rounded">{`REQUEST FOR PROPOSALS
Women's Economic Empowerment Program

FUNDER: Example Foundation
BUDGET: $200,000 - $500,000
DURATION: 24-36 months

OBJECTIVES:
1. Increase women's income by 30%
2. Establish 50 women-led enterprises
3. Create savings groups reaching 1,000 women

EVALUATION CRITERIA:
- Technical Approach (30%)
- Organizational Capacity (25%)
- Cost Effectiveness (20%)
- Innovation (15%)
- Sustainability (10%)`}</pre>
                                            <button onClick={() => { setManualContent(`REQUEST FOR PROPOSALS\nWomen's Economic Empowerment Program\n\nFUNDER: Example Foundation\nBUDGET: $200,000 - $500,000\nDURATION: 24-36 months\n\nOBJECTIVES:\n1. Increase women's income by 30%\n2. Establish 50 women-led enterprises\n3. Create savings groups reaching 1,000 women\n\nEVALUATION CRITERIA:\n- Technical Approach (30%)\n- Organizational Capacity (25%)\n- Cost Effectiveness (20%)\n- Innovation (15%)\n- Sustainability (10%)`); setShowModal(null); setActiveTab(0); }} className="mt-3 w-full bg-emerald-600 py-2 rounded text-sm">Use Sample</button>
                                        </>
                                    )}
                                    {showModal === 'budget' && (
                                        <>
                                            <h3 className="text-lg font-bold mb-3">💰 Budget Guide</h3>
                                            <div className="space-y-2 text-xs">
                                                <div className="bg-slate-700/50 p-2 rounded"><strong className="text-amber-400">Personnel (40-60%)</strong><p className="text-slate-400">PM, Technical Staff, M&E, Admin, Consultants</p></div>
                                                <div className="bg-slate-700/50 p-2 rounded"><strong className="text-amber-400">Travel (5-15%)</strong><p className="text-slate-400">Field visits, Training, International, Per diem</p></div>
                                                <div className="bg-slate-700/50 p-2 rounded"><strong className="text-amber-400">Equipment (5-15%)</strong><p className="text-slate-400">Computers, Office, Training materials</p></div>
                                                <div className="bg-slate-700/50 p-2 rounded"><strong className="text-amber-400">Activities (15-30%)</strong><p className="text-slate-400">Workshops, Events, Grants, TA</p></div>
                                                <div className="bg-slate-700/50 p-2 rounded"><strong className="text-amber-400">M&E (5-10%)</strong><p className="text-slate-400">Surveys, Data collection, Evaluation</p></div>
                                                <div className="bg-slate-700/50 p-2 rounded"><strong className="text-amber-400">Admin (7-15%)</strong><p className="text-slate-400">Rent, Utilities, Communications, Indirect</p></div>
                                            </div>
                                        </>
                                    )}
                                    <button onClick={() => setShowModal(null)} className="mt-4 w-full bg-indigo-600 py-2 rounded text-sm">Close</button>
                                </div>
                            </div>
                        )}

                        <div className="text-center mt-6 text-slate-500 text-xs no-print">Grant Proposal Writer Pro v6.0 | Auto-saves</div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<GrantProposalWriter />);
    </script>
</body>
</html>
